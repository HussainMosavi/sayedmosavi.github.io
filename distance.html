<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Distance Calculator with Map</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #map { height: 400px; width: 100%; margin-top: 20px; border: 2px solid #888; }
    input { margin: 5px; padding: 6px; }
    button { padding: 8px 12px; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h2>Distance Calculator with Map</h2>

  <p><b>Place A</b></p>
  <input id="latA" placeholder="Latitude A" />
  <input id="lonA" placeholder="Longitude A" />
  <hr />

  <p><b>Place B</b></p>
  <input id="latB" placeholder="Latitude B" />
  <input id="lonB" placeholder="Longitude B" />
  <hr />

  <button id="submit">Calculate Distance (km)</button>
  <p>Distance: <span id="output">0</span> km</p>
  <p id="msg" class="error"></p>

  <div id="map"></div>

  <script>
    // --- Map setup ---
    const map = L.map("map").setView([54.0, 9.5], 8);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap contributors"
    }).addTo(map);

    let markerA, markerB, line;

    // Helpers
    function toNum(v) {
      // support commas (e.g. "53,921")
      return parseFloat(String(v).replace(",", "."));
    }
    function clearGraphics() {
      if (markerA) map.removeLayer(markerA);
      if (markerB) map.removeLayer(markerB);
      if (line) map.removeLayer(line);
    }

    document.getElementById("submit").addEventListener("click", async () => {
      document.getElementById("msg").textContent = "";

      // Read & normalize inputs
      const latA = toNum(document.getElementById("latA").value);
      const lonA = toNum(document.getElementById("lonA").value);
      const latB = toNum(document.getElementById("latB").value);
      const lonB = toNum(document.getElementById("lonB").value);

      // Validate
      if ([latA, lonA, latB, lonB].some(n => Number.isNaN(n))) {
        document.getElementById("msg").textContent = "Bitte gültige Zahlen eingeben (Punkt oder Komma).";
        return;
      }

      // Draw map graphics (only after valid inputs)
      clearGraphics();
      markerA = L.marker([latA, lonA]).addTo(map).bindPopup("Place A");
      markerB = L.marker([latB, lonB]).addTo(map).bindPopup("Place B");
      line = L.polyline([[latA, lonA], [latB, lonB]], { color: "blue" }).addTo(map);
      map.fitBounds(line.getBounds(), { padding: [20, 20] });

      // Call your Node.js API (make sure distanceServer.js is running)
      const qs = `latA=${encodeURIComponent(latA)}&lonA=${encodeURIComponent(lonA)}&latB=${encodeURIComponent(latB)}&lonB=${encodeURIComponent(lonB)}`;
      const url = `http://localhost:8080/?${qs}`;

      try {
        const res = await fetch(url, { method: "GET" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        // Show distance
        document.getElementById("output").textContent = data.distance;
      } catch (err) {
        console.error(err);
        document.getElementById("msg").textContent =
          "Konnte die Entfernung nicht berechnen. Läuft der Server? (node distanceServer.js)";
      }
    });
  </script>
</body>
</html>
