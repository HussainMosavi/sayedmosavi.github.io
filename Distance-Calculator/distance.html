<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Distance Calculator mit Karte</title>

  <!-- Leaflet CSS + JS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    h2 { color: #2b2b2b; }
    #map {
      height: 400px;
      width: 100%;
      margin-top: 20px;
      border: 2px solid #888;
      border-radius: 8px;
    }
    input {
      margin: 5px;
      padding: 6px;
      width: 48%;
    }
    button {
      padding: 10px 15px;
      background-color: #0078d4;
      border: none;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background-color: #005a9e; }
    .error { color: #b00020; font-weight: bold; }
  </style>
</head>
<body>
  <h2>🌍 Distance Calculator mit Karte</h2>

  <p><b>Ort A</b></p>
  <input id="latA" placeholder="Breite A" />
  <input id="lonA" placeholder="Länge A" />
  <hr />

  <p><b>Ort B</b></p>
  <input id="latB" placeholder="Breite B" />
  <input id="lonB" placeholder="Länge B" />
  <hr />

  <button id="submit">Entfernung berechnen (km)</button>
  <p>Entfernung: <span id="output">0</span> km</p>
  <p id="msg" class="error"></p>

  <div id="map"></div>

  <script>
    // --- Karte initialisieren ---
    const map = L.map("map").setView([54.0, 9.5], 8);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap contributors"
    }).addTo(map);

    let markerA, markerB, line;

    // --- Hilfsfunktionen ---
    function toNum(v) {
      return parseFloat(String(v).replace(",", "."));
    }

    function clearGraphics() {
      if (markerA) map.removeLayer(markerA);
      if (markerB) map.removeLayer(markerB);
      if (line) map.removeLayer(line);
    }

    document.getElementById("submit").addEventListener("click", async () => {
      document.getElementById("msg").textContent = "";

      const latA = toNum(document.getElementById("latA").value);
      const lonA = toNum(document.getElementById("lonA").value);
      const latB = toNum(document.getElementById("latB").value);
      const lonB = toNum(document.getElementById("lonB").value);

      if ([latA, lonA, latB, lonB].some(n => Number.isNaN(n))) {
        document.getElementById("msg").textContent =
          "Bitte gültige Zahlen eingeben (Punkt oder Komma).";
        return;
      }

      // --- Marker & Linie ---
      clearGraphics();
      markerA = L.marker([latA, lonA]).addTo(map).bindPopup("Ort A").openPopup();
      markerB = L.marker([latB, lonB]).addTo(map).bindPopup("Ort B").openPopup();
      line = L.polyline([[latA, lonA], [latB, lonB]], { color: "blue" }).addTo(map);
      map.fitBounds(line.getBounds(), { padding: [20, 20] });

      // --- API-Aufruf ---
      const qs = `latA=${encodeURIComponent(latA)}&lonA=${encodeURIComponent(lonA)}&latB=${encodeURIComponent(latB)}&lonB=${encodeURIComponent(lonB)}`;
      const url = `https://distancecalc-lgn7.onrender.com/?${qs}`;
      console.log("Fetching:", url);

      try {
        const res = await fetch(url, {
          method: "GET",
          mode: "cors",
          headers: {
            "Accept": "application/json"
          }
        });

        console.log("Response status:", res.status);

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        console.log("Response data:", data);

        document.getElementById("output").textContent = data.distance;
      } catch (err) {
        console.error("Fehler:", err);
        document.getElementById("msg").textContent =
          "Konnte die Entfernung nicht berechnen. Bitte später erneut versuchen.";
      }
    });
  </script>
</body>
</html>
